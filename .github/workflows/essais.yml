name: Essais

# Les essais de gitmanager sur Linux, Windows et macOS, a chaque push sur main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essais:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Essais
        run: cargo test --locked
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --all-targets -- -D warnings
